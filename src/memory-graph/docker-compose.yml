services:
  postgres:
    image: postgres:16
    container_name: memory-graph-postgres
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    volumes:
      - memory_graph_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  memory-graph:
    build: .
    container_name: memory-graph-mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEMORY_GRAPH_DATABASE_URL: postgresql://memory:memory@postgres:5432/memory
      MEMORY_GRAPH_TRANSPORT: http
      MEMORY_GRAPH_HTTP_HOST: 0.0.0.0
      MEMORY_GRAPH_HTTP_PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  memory_graph_pg_data:
